name: Lumitext
options:
  createIntermediateGroups: true
  developmentLanguage: en
  # en = inline default-value strings (development language); zh-Hans has a real
  # .lproj under App/Resources. No Base.lproj exists — don't declare one.
  knownRegions:
    - en
    - zh-Hans
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.2.0"
    ENABLE_HARDENED_RUNTIME: false
packages:
  LumitextCore:
    path: Packages/LumitextCore
  PaperSaver:
    url: https://github.com/AerialScreensaver/PaperSaver
    revision: 23e4bb4362e10b6ab0d6a3cc5369eed76bc7d169
targets:
  Lumitext:
    type: application
    platform: macOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fanhefeng.lumitext
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # NOTE: entitlements applied post-build by scripts/dev-build-install.sh
        # (release: scripts/sign.sh) — declaring CODE_SIGN_ENTITLEMENTS here
        # triggers Xcode's provisioning checks, which ad-hoc dev signing cannot
        # satisfy. `codesign` itself has no such check.
        PRODUCT_NAME: Lumitext
    dependencies:
      - target: LumitextSaver
        embed: true
      - package: LumitextCore
      - package: PaperSaver
        product: PaperSaverKit
  LumitextSaver:
    type: app-extension
    platform: macOS
    sources:
      - Saver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fanhefeng.lumitext.saver
        INFOPLIST_FILE: Saver/Info.plist
        # entitlements applied post-build — see note on the Lumitext target
        PRODUCT_NAME: LumitextSaver
        PRODUCT_MODULE_NAME: LumitextSaver
        SWIFT_OBJC_BRIDGING_HEADER: Saver/Bridging-Header.h
    dependencies:
      - sdk: ScreenSaver.framework
      - package: LumitextCore
  # Hosted unit tests for the app layer (AppModel decision table, the move
  # swap algorithm, the /Applications gate) — Core has its own SPM tests; this
  # target exists so app-side load-bearing logic is no longer structurally
  # untestable. Run via: xcodebuild test -scheme Lumitext (launches the app as
  # the test host).
  LumitextAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AppTests
    dependencies:
      - target: Lumitext
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fanhefeng.lumitext.apptests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lumitext.app/Contents/MacOS/Lumitext"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Lumitext:
    build:
      targets:
        Lumitext: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LumitextAppTests
    archive:
      config: Release
